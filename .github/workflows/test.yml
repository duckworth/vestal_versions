---
name: Tests
'on':
  push:
    branches:
    - master
    - develop
  pull_request:
    branches:
    - master
    - develop
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
        - ruby: 2.7.5
          gemfile: gemfiles/activerecord_7_0.gemfile
        - ruby: 3.0.5
          gemfile: gemfiles/activerecord_7_0.gemfile
        - ruby: 3.2.2
          gemfile: gemfiles/activerecord_7_1.gemfile
        - ruby: 3.3.4
          gemfile: gemfiles/activerecord_7_2.gemfile
        - ruby: 3.2.2
          gemfile: gemfiles/activerecord_8_0.gemfile
        - ruby: 3.4.8
          gemfile: gemfiles/activerecord_8_1.gemfile
        - ruby: ruby-head
          gemfile: Gemfile
        - ruby: ruby-head
          gemfile: gemfiles/activerecord_7_1.gemfile
        - ruby: 3.3.4
          gemfile: Gemfile
    env:
      BUNDLE_GEMFILE: "${{ matrix.gemfile }}"
    steps:
    - uses: actions/checkout@v5
    - name: Install ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: "${{ matrix.ruby }}"
        bundler-cache: true
    - name: Run tests
      run: bundle exec rspec
